<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfolio Front-End .NET oriente interfaces metier industrielles, data visualisation et UI/UX B2B." />
    <meta name="theme-color" content="#091521" />
    <title>Merryl - Front-End .NET industriel</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">x</span>
    </div>
    <script>
        window.portfolioMotion = {
            prefersReducedMotion: () => window.matchMedia("(prefers-reduced-motion: reduce)").matches
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
