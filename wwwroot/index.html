<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">x</span>
    </div>
    <script>
        window.portfolioMotion = {
            prefersReducedMotion: () => window.matchMedia("(prefers-reduced-motion: reduce)").matches,
            observeReveals: () => {
                const elements = document.querySelectorAll("[data-reveal]:not([data-reveal-ready])");
                const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

                if (reducedMotion || !("IntersectionObserver" in window)) {
                    elements.forEach((element) => element.classList.add("is-visible"));
                    return;
                }

                window.portfolioRevealObserver ??= new IntersectionObserver((entries, observer) => {
                    entries.forEach((entry) => {
                        if (!entry.isIntersecting) return;
                        entry.target.classList.add("is-visible");
                        observer.unobserve(entry.target);
                    });
                }, { rootMargin: "0px 0px -10% 0px", threshold: 0.08 });

                elements.forEach((element) => {
                    element.setAttribute("data-reveal-ready", "true");
                    window.portfolioRevealObserver.observe(element);
                });
            }
        };
    </script>
    <script>
        document.querySelectorAll("[data-static-head]").forEach((element) => element.remove());
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>
