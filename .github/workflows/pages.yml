name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    env:
      HAS_PAGES_TOKEN: ${{ secrets.PAGES_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Portfolio.slnx

      - name: Run tests
        run: dotnet test Portfolio.slnx --configuration Release --no-restore --verbosity normal

      - name: Publish Blazor WebAssembly
        run: dotnet publish Portfolio.csproj --configuration Release --no-restore --output publish

      - name: Configure GitHub Pages with enablement
        if: env.HAS_PAGES_TOKEN == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ secrets.PAGES_TOKEN }}

      - name: Configure GitHub Pages
        if: env.HAS_PAGES_TOKEN != 'true'
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          sed -i 's#<base href="/" />#<base href="/Portfolio/" />#g' publish/wwwroot/index.html
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
